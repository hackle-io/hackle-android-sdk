name: update javascript sdk

on:
  schedule:
    - cron: '0 23 * * 0' # 매주 월요일 08:00 KST
  workflow_dispatch:

env:
  BRIDGE_SCRIPT: hackle-android-sdk/src/main/java/io/hackle/android/ui/inappmessage/view/html/InAppMessageHtmlBridgeUserScript.kt
  ASSETS_DIR: hackle-android-sdk/src/main/assets

jobs:
  check-js-sdk-version:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
      js_sdk_version: ${{ steps.check.outputs.js_sdk_version }}
      feature_branch: ${{ steps.check.outputs.feature_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Check latest JS SDK version
        id: check
        run: |
          JS_SDK_VERSION=$(curl -sSf "https://registry.npmjs.org/-/package/@hackler%2Fjavascript-sdk/dist-tags" | jq -r '.latest')
          if [[ ! "$JS_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: js_sdk_version must be in X.Y.Z format: $JS_SDK_VERSION"
            exit 1
          fi
          FEATURE_BRANCH="feature/update-hackle-javascript-sdk-$JS_SDK_VERSION"
          echo "js_sdk_version=$JS_SDK_VERSION" >> $GITHUB_OUTPUT
          echo "feature_branch=$FEATURE_BRANCH" >> $GITHUB_OUTPUT

          CURRENT=$(sed -n -E 's/.*JAVASCRIPT_SDK_VERSION = "([^"]+)".*/\1/p' "$BRIDGE_SCRIPT")
          if [[ -z "$CURRENT" ]]; then
            echo "Error: Failed to parse current JS SDK version"
            exit 1
          fi
          echo "current: $CURRENT, latest: $JS_SDK_VERSION"

          if [[ "$CURRENT" == "$JS_SDK_VERSION" ]]; then
            echo "JS SDK is already up to date"
            echo "should_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git ls-remote --heads origin "$FEATURE_BRANCH" | grep -q .; then
            echo "Branch $FEATURE_BRANCH already exists"
            echo "should_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_update=true" >> $GITHUB_OUTPUT

  calculate-version:
    needs: check-js-sdk-version
    if: needs.check-js-sdk-version.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          CURRENT_VERSION=$(sed -n -E 's/sdk_version=([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' gradle.properties)
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Error: Failed to parse current SDK version"
            exit 1
          fi
          IFS='.' read -ra V <<< "${CURRENT_VERSION%%-*}"
          NEW_MINOR=$((V[1] + 1))
          NEW_VERSION="${V[0]}.$NEW_MINOR.0"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  prepare-branch:
    needs: calculate-version
    uses: ./.github/workflows/create_dev_branch.yml
    with:
      new_version: ${{ needs.calculate-version.outputs.new_version }}

  update-sdk-version:
    needs: prepare-branch
    uses: ./.github/workflows/update_sdk_version.yml
    with:
      branch: ${{ needs.prepare-branch.outputs.branch_name }}

  update-sdk:
    needs: [check-js-sdk-version, calculate-version, prepare-branch]
    runs-on: ubuntu-latest
    env:
      JS_SDK_VERSION: ${{ needs.check-js-sdk-version.outputs.js_sdk_version }}
      FEATURE_BRANCH: ${{ needs.check-js-sdk-version.outputs.feature_branch }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-branch.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download JS SDK from npm
        run: |
          npm pack "@hackler/javascript-sdk@$JS_SDK_VERSION" --pack-destination /tmp
          cd /tmp
          tar xzf hackler-javascript-sdk-*.tgz
          SOURCE_FILE="/tmp/package/lib/index.browser.umd.min.js"
          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Error: Expected file not found at $SOURCE_FILE"
            echo "Package contents:"
            find /tmp/package -type f
            exit 1
          fi

      - name: Replace JS SDK file
        run: |
          cp /tmp/package/lib/index.browser.umd.min.js \
            "$ASSETS_DIR/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js"
          ls "$ASSETS_DIR/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js" || \
            { echo "Error: JS SDK file not found after copy"; exit 1; }
          find "$ASSETS_DIR" -name "hackle-javascript-sdk-*.min.js" \
            ! -name "hackle-javascript-sdk-${JS_SDK_VERSION}.min.js" -delete

      - name: Update version constant
        run: |
          sed -i -E "s/JAVASCRIPT_SDK_VERSION = \"[^\"]+\"/JAVASCRIPT_SDK_VERSION = \"$JS_SDK_VERSION\"/g" \
            "$BRIDGE_SCRIPT"

      - name: Verify no stale JS SDK references
        run: |
          STALE_ASSETS=$(find "$ASSETS_DIR" -name "hackle-javascript-sdk-*.min.js" \
            ! -name "hackle-javascript-sdk-${JS_SDK_VERSION}.min.js")
          if [[ -n "$STALE_ASSETS" ]]; then
            echo "Error: stale JS SDK assets remain"
            echo "$STALE_ASSETS"
            exit 1
          fi
          if ! grep -q "JAVASCRIPT_SDK_VERSION = \"${JS_SDK_VERSION}\"" "$BRIDGE_SCRIPT"; then
            echo "Error: JAVASCRIPT_SDK_VERSION was not updated in $BRIDGE_SCRIPT"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$FEATURE_BRANCH"
          git add "$ASSETS_DIR" "$BRIDGE_SCRIPT"
          git commit -m "chore: update @hackler/javascript-sdk@$JS_SDK_VERSION"
          git push origin "$FEATURE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_BRANCH: ${{ needs.prepare-branch.outputs.branch_name }}
        run: |
          gh pr create \
            --base "$DEV_BRANCH" \
            --title "[Automation] Update @hackler/javascript-sdk@$JS_SDK_VERSION" \
            --body "## Description
          - Update @hackler/javascript-sdk@$JS_SDK_VERSION"
